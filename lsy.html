<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高端标题</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0c10 0%, #1f2833 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 主标题 —— 大大的钟一菲 */
        .main-title {
            font-size: clamp(4rem, 18vw, 11rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            text-align: center;
            line-height: 1.1;
            background: linear-gradient(to right, #f9d423, #ff4e50);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 78, 80, 0.4);
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5));
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 15px rgba(249, 212, 35, 0.5)); }
            100% { filter: drop-shadow(0 0 35px rgba(255, 78, 80, 0.9)); }
        }

        /* 按钮通用样式 */
        .btn {
            background: #1e2b3a;
            border: none;
            color: #e0e9f5;
            font-size: 1.4rem;
            font-weight: 600;
            padding: 0.9rem 3rem;
            border-radius: 60px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 8px 0 #0b0f14, 0 10px 25px rgba(0, 0, 0, 0.6);
            transition: all 0.1s ease;
            border: 1px solid #3e5a76;
            text-shadow: 0 2px 4px black;
            margin: 0.5rem 0;
            position: relative;
            z-index: 10;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #0b0f14, 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .btn:hover {
            background: #2a3d52;
            color: #fff;
            border-color: #7aa5d9;
        }

        /* 第一个按钮 —— 点击后卡片飘上来 */
        #spawnCardBtn {
            background: #2a3d52;
            border-color: #f9d423;
            color: #ffe484;
        }

        /* 第二个按钮 —— 点击后卡片变窗口弹一堆 */
        #explodeBtn {
            background: #3a1f2b;
            border-color: #ff4e50;
            color: #ff9e9e;
            margin-top: 1rem;
            opacity: 0.9;
        }

        #explodeBtn:disabled {
            opacity: 0.35;
            transform: none;
            box-shadow: 0 8px 0 #0b0f14, 0 10px 25px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            filter: grayscale(0.6);
        }

        /* 卡片容器：初始隐藏，卡片从这里飘上来 */
        .card-area {
            position: relative;
            min-height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 1rem 0;
            width: 100%;
        }

        /* 飘上来的卡片本体 */
        .floating-card {
            background: #fcf9f2;
            background-image: radial-gradient(circle at 20% 30%, #fff8e7, #f0e6d8);
            padding: 1.8rem 4rem;
            border-radius: 24px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), 0 0 0 2px #ffd966, 0 0 0 5px #2a1f0e;
            font-size: 3rem;
            font-weight: 900;
            color: #1e1a16;
            letter-spacing: 6px;
            text-align: center;
            transform: translateY(220px) rotate(3deg);
            opacity: 0;
            transition: transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1.15), opacity 0.5s ease;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            border: 2px solid #c9a34b;
            text-shadow: 2px 2px 0 #ffcc80;
            z-index: 20;
        }

        .floating-card.show {
            transform: translateY(0) rotate(-1deg);
            opacity: 1;
            pointer-events: auto;
        }

        /* 弹窗的样式 —— 变成窗口弹一堆 */
        .popup-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .window-card {
            position: absolute;
            background: #2d2f36;
            border-radius: 16px;
            box-shadow: 0 30px 40px -10px black, 0 0 0 2px #5e6b7c, 0 0 0 4px #1e1f24;
            padding: 1.2rem 2.2rem;
            font-size: 2rem;
            font-weight: 800;
            color: #f5d9b0;
            text-shadow: 0 2px 0 #0a0a0a;
            letter-spacing: 3px;
            white-space: nowrap;
            border-top: 3px solid #b8863d;
            border-bottom: 3px solid #4d3e2c;
            background: linear-gradient(145deg, #3d3f4a, #24262e);
            box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.9), inset 0 1px 4px #b0a58b, 0 0 0 1px #8b7a5c;
            animation: popIn 0.2s cubic-bezier(0.2, 1.2, 0.4, 1);
            pointer-events: none;
            user-select: none;
        }

        @keyframes popIn {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* 一些浮动装饰线条 */
        .glow-line {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent               , #f9d423, #ff const4e50, transparent);
            pop filter: blur(2pxup);
            opacity: 0.6;
            z-index: 1;
        }

        /* 防止页面滚动条乱跳 */
        body.no-scroll {
            overflow: hidden;
        }

        .hint {
            color: #abb7c2;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-top: 0.8rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- 大标题 -->
    <h1 class="main-title">林舒言</h1>

    <!-- 按钮1：点击后卡片从地下飘上来 -->
    <button class="btn" id="spawnCardBtn">点 击</button>

    <!-- 卡片出现的位置 -->
    <div class="card-area">
        <div class="floating-card" id="specialCard">我操你妈</div>
    </div>

    <!-- 按钮2：点击后卡片变窗口弹一堆 -->
    <button class="btn" id="explodeBtn" disabled>点我</button>
    <div class="hint">点我</div>

    <!-- 动态弹窗容器（不需要静态内容，由js生成） -->
    <div class="popup-window" id="popupContainer"></div>

    <!-- 底部装饰线 -->
    <div class="glow-line"></div>

    <script>
        (function() {
            const spawnBtn = document.getElementById('spawnCardBtn');
            const explodeBtn = document.getElementById('explodeBtn');
            const floatingCard = document.getElementById('specialCard');
            const popupContainer = document.getElementById('popupContainer');

            // 确保卡片初始不在显示状态 (CSS已处理，但以防万一)
            floatingCard.classList.remove('show');
            // 禁用第二个按钮
            explodeBtn.disabled = true;

            // 检查卡片是否已经飘上来 (避免重复触发动画)
            let isCardShown = false;
            // 记录已经弹出了多少窗口 (无需限制数量，但避免过度堆积可以设置上限，但题目说一堆，那就狂弹)
            let popupCount = 0;

            // ---- 点击第一个按钮：卡片从下方飘上来 ----
            spawnBtn.addEventListener('click', function() {
                if (!isCardShown) {
                    // 第一次点击：显示卡片
                    floatingCard.classList.add('show');
                    isCardShown = true;
                    // 启用第二个按钮
                    explodeBtn.disabled = false;
                } else {
                    // 如果已经显示，也可以重新触发一下动画（先移除再添加，实现重新飘上来）
                    floatingCard.classList.remove('show');
                    // 强制重绘
                    void floatingCard.offsetWidth;
                    floatingCard.classList.add('show');
                }
                // 每次点击第一个按钮都确保第二个按钮可用（如果卡片是显示状态）
                if (isCardShown) {
                    explodeBtn.disabled = false;
                }
            });

            // ---- 点击第二个按钮：卡片变窗口，弹一堆 ----
            explodeBtn.addEventListener('click', function() {
                // 只有卡片已经显示才执行，否则按钮应该是禁用的，但再加一层保险
                if (!isCardShown) {
                    return;
                }

                // 1. 让卡片本身消失 (视觉上它“变成窗口”了)
                floatingCard.classList.remove('show');
                // 但也允许它再次出现；暂时隐藏，但保留isCardShown标记，不影响再次点击第一个按钮
                // 注意：卡片消失后，第二个按钮应该还可用，但根据心理模型，点击之后卡片已变为窗口，可以重新点第一个按钮让卡片回来
                // 但我们要将第二个按钮暂时禁用避免重复点？不，再点第二个按钮应该继续弹更多窗口，效果更爽
                // 所以第二个按钮保持启用 (但卡片已隐藏，如果再次点第二个按钮，仍会弹出更多窗口，符合“变窗口弹一堆”叠加效果)
                // 不过为了让体验更符合描述：点第二个按钮后卡片变成窗口弹一堆。卡片消失，但按钮仍然可以继续弹。
                // 但为了继续支持再次点第一个按钮让卡片回来，isCardShown设为false，这样第一个按钮可以再次让卡片飘上来
                // 注意：我们需要让卡片再次可以“飘上来”，所以重置 isCardShown 为 false，但第二个按钮必须禁用（直到卡片再次飘上来）
                isCardShown = false;
                // 暂时禁用第二个按钮，直到卡片再次飘上来
                explodeBtn.disabled = true;

                // 2. 生成一堆窗口 (30个左右，但限制最大数量防止页面太卡，最多弹100个)
                const MAX_POPUPS = 120;
                // 若已达到上限，先移除最早的一部分窗口(为了可玩性，设定一个上限，防止卡死)
                if (popupContainer.children.length >= MAX_POPUPS) {
                    // 移除前50个旧窗口
                    const removeCount = 50;
                    for (let i = 0; i < removeCount; i++) {
                        if (popupContainer.firstChild) {
                            popupContainer.removeChild(popupContainer.firstChild);
                        } else {
                            break;
                        }
                    }
                }

                // 窗口内容
                const textContent = '窝曹泥马';
                // 弹窗数量：30~50 左右，视觉效果爆炸
Num = Math.floor(Math.random() * 20) + 30; // 30~49

                for (let i = 0; i < popupNum; i++) {
                    createPopupWindow(textContent);
                }

                // 额外增加一点随机颜色抖动? 不用
            });

            // 创建单个弹窗的函数
            function createPopupWindow(text) {
                const win = document.createElement('div');
                win.className = 'window-card';
                win.textContent = text;

                // 随机旋转 ±12度
                const rotate = (Math.random() * 24 - 12).toFixed(1);
                // 随机大小：字体大小 1.4rem ~ 2.8rem
                const fontSize = (Math.random() * 1.4 + 1.4).toFixed(1); // 1.4 ~ 2.8
                // 随机位置：基于视口宽度高度的百分比，避免太靠边
                const left = (Math.random() * 82 + 5).toFixed(1); // 5% ~ 87%
                const top = (Math.random() * 82 + 5).toFixed(1);   // 5% ~ 87%

                // 随机阴影/颜色微调 (可选)
                win.style.left = left + '%';
                win.style.top = top + '%';
                win.style.transform = `rotate(${rotate}deg)`;
                win.style.fontSize = fontSize + 'rem';
                // 随机给一点位置偏移，使用translate实现更丰富的重叠
                win.style.marginLeft = (Math.random() * 30 - 15) + 'px';
                win.style.marginTop = (Math.random() * 30 - 15) + 'px';
                // 随机透明度 0.9~1 (几乎不透明，清晰)
                win.style.opacity = (Math.random() * 0.2 + 0.8).toFixed(2);
                // 随机z-index让它们有些重叠错落
                win.style.zIndex = Math.floor(Math.random() * 5000) + 100;

                // 设置动画延迟，让它们不是同时出现，有“弹出一堆”的错落感
                // 但因为我们是在同一个事件循环里生成，可以用setTimeout稍微延迟一部分，但为了性能，直接全部生成。
                // 为了看起来更“一堆”爆炸，部分窗口加一点动画延迟
                if (Math.random() > 0.6) {
                    win.style.animationDelay = (Math.random() * 0.15) + 's';
                }

                // 添加到容器
                popupContainer.appendChild(win);

                // 可选：窗口出现后不做自动消失（保留一堆窗口效果）。但太多可以限制数量。
                // 可以给每个窗口加一个点击消失？但不需要，那是额外功能。
            }

            // 可选：点击页面空白区域（比如背景）重置弹窗？但可能不需要，重置按钮已经很清楚了。
            // 但为了不让弹窗越积越多影响性能，在点击第一个按钮时清理一部分？
            // 但是用户可能会先弹一堆，然后点第一个按钮让卡片回来再弹。
            // 更好的体验：当点击第一个按钮时，自动清理所有弹窗，重新开始
            spawnBtn.addEventListener('click', function() {
                // 清理所有弹窗（“重置”）
                while (popupContainer.firstChild) {
                    popupContainer.removeChild(popupContainer.firstChild);
                }
                popupCount = 0;
                // 注意：清理后，弹窗没了，但是卡片状态仍由主逻辑控制，上面已经处理isCardShown和动画
                // 如果之前卡片已经隐藏，再次点击按钮会显示卡片，同时第二个按钮也启用。
                // 但如果卡片已经显示，重新触发动画，我们不需要改变isCardShown，但可能希望窗口消失
                // 已经在上面处理了“重新飘上来”的情况，但是清理弹窗这个操作要放在显示卡片逻辑里。
                // 但是有个小问题：重置后如果卡片在显示状态，第二个按钮仍然可用；如果卡片原本隐藏，重新显示后也会启用。
                // 一切正常。
            });

            // 但上面spawnBtn的清理操作可能导致一个问题：当点击第一个按钮时，无论卡片是否显示，都会先清理所有弹窗。
            // 这个行为很好，符合预期。
            // 但是需要确保点击第一个按钮时，如果卡片是显示状态，重置后仍保留显示状态，但我们已经add了show类。
            // 另外还要重新启用第二个按钮 (因为清空弹窗后，卡片还在显示，所以第二个按钮必须可用)
            // 调整spawnBtn的逻辑：合并处理
            // 移除之前添加的多个监听，重构spawnBtn逻辑

            // 移除之前添加的监听，重新绑定，避免冲突
            // 其实之前绑定了两次，会产生重复行为，我们重写所有逻辑，保证干净。

            // 重新整理代码：采用新的监听器覆盖
            // 移除旧的监听（通过新加监听无法移除，我们可以直接刷新逻辑，用新的监听器覆盖？）
            // 但最简单的方式：禁用之前的监听? 我们可以用新监听器替换，但旧监听器依然存在。所以整体重构。

            // 完全重构: 删除之前的监听，用新监听替代 (通过克隆替换技术)
            // 但为了干净，我们直接重置按钮的监听：使用新按钮替换? 或者通过事件捕获? 干脆重新整理代码。
            // 但因为脚本在最后，且没有其他干扰，我把之前绑定的监听全部移除，重新绑定。
            // 通过removeEventListener并不是保存了函数引用，所以不行。
            // 最干脆: 将spawnBtn和explodeBtn替换为克隆节点，移除所有旧监听。

            // 但用克隆太麻烦，直接在dom加载后重新绑定一次，并移除原有监听（无法移除）
            // 我可以在更早的阶段定义函数，但已经这样了，所以采用克隆方法重置按钮，确保干净。

            // 用新按钮替换，去掉所有旧监听
            const spawnBtnClone = spawnBtn.cloneNode(true);
            const explodeBtnClone = explodeBtn.cloneNode(true);
            spawnBtn.parentNode.replaceChild(spawnBtnClone, spawnBtn);
            explodeBtn.parentNode.replaceChild(explodeBtnClone, explodeBtn);

            // 重新获取引用
            const newSpawnBtn = document.getElementById('spawnCardBtn'); // 但克隆后id不变
            const newExplodeBtn = document.getElementById('explodeBtn');
            // 注意克隆后id依然存在，但我们需要重新获取
            const newSpawn = document.querySelector('#spawnCardBtn');
            const newExplode = document.querySelector('#explodeBtn');

            // 确保引用正确
            const spawnButton = newSpawn;
            const explodeButton = newExplode;

            // 重置卡片状态
            floatingCard.classList.remove('show');
            isCardShown = false;
            // 清空弹窗容器
            popupContainer.innerHTML = '';
            // 设置按钮禁用状态
            explodeButton.disabled = true;

            // 重新绑定第一个按钮事件
            spawnButton.addEventListener('click', function() {
                // 清理所有弹窗
                popupContainer.innerHTML = '';
                // 重置卡片显示状态：如果卡片隐藏则显示，如果已显示则重新触发动画
                if (!isCardShown) {
                    floatingCard.classList.add('show');
                    isCardShown = true;
                    explodeButton.disabled = false;
                } else {
                    // 已显示，重新触发动画
                    floatingCard.classList.remove('show');
                    void floatingCard.offsetWidth;
                    floatingCard.classList.add('show');
                    // 确保第二个按钮可用
                    explodeButton.disabled = false;
                }
            });

            // 重新绑定第二个按钮事件
            explodeButton.addEventListener('click', function() {
                if (!isCardShown) return;

                // 卡片消失（变成窗口）
                floatingCard.classList.remove('show');
                // 卡片隐藏后，isCardShown设为false，但第二个按钮暂时不能用了（防止连续点，但如果我们想保留继续弹窗口的能力，可以不禁用）
                // 但为了符合逻辑：点击后卡片变窗口弹一堆，此时卡片没了，如果再次点击第二个按钮，仍然可以继续弹更多窗口。
                // 因为卡片已经变成窗口，所以按钮可以继续用，但是为了鼓励用户再次点击第一个按钮让卡片回来，
                // 我们将isCardShown设为false, 并禁用第二个按钮？但是那样用户想继续弹窗口还得先点第一个按钮，稍微合理。
                // 我们可以不禁用第二个按钮，但isCardShown=false后，点第二个按钮不会有任何反应因为if(!isCardShown)return; 所以还是禁用视觉上更好。
                isCardShown = false;
                explodeButton.disabled = true;

                // 限制弹窗总数
                const MAX_POPUPS = 120;
                if (popupContainer.children.length >= MAX_POPUPS) {
                    // 移除前60个
                    for (let i = 0; i < 60; i++) {
                        if (popupContainer.firstChild) {
                            popupContainer.removeChild(popupContainer.firstChild);
                        } else break;
                    }
                }

                const text = '我操你妈';
                const count = Math.floor(Math.random() * 25) + 35; // 35~59个

                for (let i = 0; i < count; i++) {
                    createPopupWindow(text);
                }
            });

            // 创建窗口函数保持不变
            function createPopupWindow(text) {
                const win = document.createElement('div');
                win.className = 'window-card';
                win.textContent = text;

                const rotate = (Math.random() * 24 - 12).toFixed(1);
                const fontSize = (Math.random() * 1.4 + 1.4).toFixed(1);
                const left = (Math.random() * 82 + 5).toFixed(1);
                const top = (Math.random() * 82 + 5).toFixed(1);

                win.style.left = left + '%';
                win.style.top = top + '%';
                win.style.transform = `rotate(${rotate}deg)`;
                win.style.fontSize = fontSize + 'rem';
                win.style.marginLeft = (Math.random() * 30 - 15) + 'px';
                win.style.marginTop = (Math.random() * 30 - 15) + 'px';
                win.style.opacity = (Math.random() * 0.2 + 0.8).toFixed(2);
                win.style.zIndex = Math.floor(Math.random() * 5000) + 100;

                if (Math.random() > 0.6) {
                    win.style.animationDelay = (Math.random() * 0.15) + 's';
                }

                popupContainer.appendChild(win);
            }
