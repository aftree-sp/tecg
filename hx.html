<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #ffffff;
            color: #222222;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }
        /* 右下角水印文字 */
        .watermark {
            position: fixed;
            right: 16px;
            bottom: 16px;
            font-size: 12px;
            color: #999;
            pointer-events: none;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 32px;
            font-weight: 600;
        }
        .button-wrap {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 32px;
        }
        .music-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            background:#fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .music-btn:hover {
            background-color: #f3f4f6;
        }
        .music-btn svg {
            width:24px;
            height:24px;
            flex-shrink:0;
        }
        .iframe-container {
            width: 100%;
            max-width: 660px;
        }
    </style>
</head>
